name: LoriLocal
options:
  bundleIdPrefix: ru.ilyaqa.lori
  deploymentTarget:
    iOS: "18.0"
configs:
  Debug: debug
  Release: release
  QA: debug
schemes:
  LoriLocal:
    build:
      targets:
        LoriLocal: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
  LoriQA:
    build:
      targets:
        LoriLocal: all
    run:
      config: QA
    test:
      config: QA
      targets: [LoriLocalTests, LoriLocalUITests]
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    # Приложение целиком русское, но бандл заявлял английский — и системные
    # кнопки приходили английскими: `EditButton` показывал «Edit» посреди
    # «Словаря» и «Хранилища».
    DEVELOPMENT_LANGUAGE: ru
    # Bundle ID, имя и версия — на уровне проекта, а не цели: их делят
    # приложение и встроенное расширение Live Activity. ID расширения обязан
    # начинаться с ID приложения (`<приложение>.RecordingActivity`) в каждой
    # конфигурации, а версия и номер сборки — совпадать с приложением: иначе
    # сборка предупреждает, а установка встроенного расширения не гарантирована.
    # Номер сборки для IPA Shelf поднимается здесь.
    LORI_APP_BUNDLE_ID: ru.ilyaqa.lori.local
    LORI_DISPLAY_NAME: Lori
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"
  configs:
    QA:
      LORI_APP_BUNDLE_ID: ru.ilyaqa.lori.local.qa
      LORI_DISPLAY_NAME: Lori QA
# ONNX Runtime — чтобы GigaAM ставился одной кнопкой: готовых Core ML-моделей
# GigaAM никто не публикует, а int8-ONNX лежит на HuggingFace открыто.
packages:
  # MLX — библиотека Apple для вычислений на GPU через общую память. Нужна не
  # распознаванию, а модели, которая делает заголовок и описание расшифровки:
  # у неё генерация с KV-кэшем, которого в ONNX Runtime пришлось бы вести вручную.
  mlx-swift-examples:
    url: https://github.com/ml-explore/mlx-swift-examples
    from: 2.29.1
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.24.2
  # WhisperKit — Core ML-движок Whisper. Веса в пакет не входят и в сборку не
  # попадают: turbo весит 632 МБ, его кладут руками в Lori/Models.
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0
targets:
  LoriLocal:
    type: application
    platform: iOS
    sources:
      - path: LoriLocal
      # Атрибуты Live Activity и интенты её кнопок — общие с расширением:
      # расширение рисует кнопки, а интенты система исполняет в процессе
      # приложения (`LiveActivityIntent`).
      - path: Shared
    postBuildScripts:
      - name: Personal API keys
        script: 'python3 "${SRCROOT}/tools/embed-api-keys.py"'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: onnxruntime
        product: onnxruntime
      - package: mlx-swift-examples
        product: MLXLLM
      - package: mlx-swift-examples
        product: MLXLMCommon
      - package: ArgmaxOSS
        product: WhisperKit
      # Расширение с Live Activity записи: островок и экран блокировки.
      - target: RecordingActivity
    # Без entitlements Keychain на симуляторе отвечает «A required entitlement
    # isn't present» (-34018): рантаймам iOS 17+ нужен application-identifier,
    # а он появляется только вместе с обработкой entitlements при подписи.
    # $(AppIdentifierPrefix) на устройстве раскрывается в TEAMID, на симуляторе — пуст.
    entitlements:
      path: LoriLocal/LoriLocal.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: LoriLocal/Info.plist
      properties:
        CFBundleDisplayName: $(LORI_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # «Поделиться» → Lori держится на типах документов, а не на Share
        # Extension: расширению нужен общий контейнер App Group, а App Groups
        # бесплатная команда разработчика не подписывает. Система сама кладёт
        # копию в Documents/Inbox и будит приложение через `onOpenURL`.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Аудиозапись
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - public.aac-audio
              - com.microsoft.waveform-audio
              - public.aiff-audio
        NSMicrophoneUsageDescription: "Lori записывает звук с микрофона, чтобы потом расшифровать его в текст."
        NSSpeechRecognitionUsageDescription: "Lori распознаёт речь из ваших записей движком iOS прямо на этом iPhone."
        NSLocalNetworkUsageDescription: "Lori скачивает модели распознавания и обращается к сервису расшифровки на вашем компьютере в этой же сети, если вы указали адрес в настройках."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Работа не должна обрываться, когда человек ушёл из приложения или запер
        # телефон: расшифровка часовой записи идёт минутами. Держит её
        # `BGContinuedProcessingTask` (iOS 26) — он же и рисует полосу прогресса
        # расшифровки в Dynamic Island и на локскрине, и своей полосы у неё нет.
        #
        # `audio` — запись разговора идёт и тогда, когда человек вышел из Lori
        # (владелец, 24 октября 2026). Без него iOS глушит микрофон при уходе в
        # фон, и запись обрывается на первой же секунде вне приложения.
        UIBackgroundModes:
          - audio
          - processing
        # Live Activity — только у записи: кнопки «Пауза», «Продолжить»,
        # «Расшифровать» в островке и на экране блокировки. Системная полоса
        # расшифровки их дать не может. Расшифровка своей активности не заводит.
        NSSupportsLiveActivities: true
        # Схема ссылок — сам bundle ID: у Lori и Lori QA она своя, и ссылка из
        # островка не откроет чужую сборку. Ссылкой открывается Lori, когда
        # «Расшифровать» нажали при движке на телефоне: заявку на фоновую
        # расшифровку iOS принимает только от приложения на виду.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
        # Здесь — **базовый** идентификатор, без `.*`. Проверено на iOS 26.5 (см.
        # `TranscriptionRunway`): запись с шаблоном планировщик не принимает вовсе
        # («Registration rejected; … is not advertised in the application's
        # Info.plist»), а базовая разрешает регистрацию и базовой формы, и формы с
        # шаблоном. Шаблон живёт только в `register`, заявка — `…transcribe.<uuid>`.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).transcribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LORI_APP_BUNDLE_ID)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Тот же оливковый, что и `LoriPalette.lime`. Нужен системным экранам,
        # которые рисует не SwiftUI: пикер файлов, шит «Поделиться», алерты.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Live Activity записи: островок и экран блокировки. Расширение только рисует:
  # состояние приходит в `ContentState` от приложения, кнопки — интенты, которые
  # система исполняет в процессе приложения. App Group не нужен — её бесплатная
  # команда не подписывает.
  RecordingActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: RecordingActivity
      - path: Shared
    info:
      path: RecordingActivity/Info.plist
      properties:
        CFBundleDisplayName: $(LORI_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ru]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LORI_APP_BUNDLE_ID).RecordingActivity
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
  LoriLocalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoriLocalTests
    dependencies:
      - target: LoriLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ilyaqa.lori.local.tests
        GENERATE_INFOPLIST_FILE: YES
  LoriLocalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoriLocalUITests
    dependencies:
      - target: LoriLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ilyaqa.lori.local.uitests
        GENERATE_INFOPLIST_FILE: YES
